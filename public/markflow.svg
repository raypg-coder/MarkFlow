<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
       MarkFlow · v2 logo
       Flowing "M" sitting on a single flowing stream line.
       M = Mark(down), the stream = Flow. Apple blue gradient
       rounded square (Mantle family) + white geometric strokes.
  -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#4a9eff"/>
      <stop offset="100%" stop-color="#0066d6"/>
    </linearGradient>
    <radialGradient id="hl" cx="24%" cy="18%" r="64%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#hl)"/>

  <!-- Flowing M -->
  <path d="M 268 668 L 268 348 L 512 580 L 756 348 L 756 668"
        fill="none" stroke="#ffffff" stroke-width="116"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Flow stream line -->
  <path d="M 232 778 q 140 -70 280 0 t 280 0"
        fill="none" stroke="#ffffff" stroke-width="38"
        stroke-linecap="round" opacity="0.72"/>
</svg>
